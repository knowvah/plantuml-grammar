*69{6}|8-0*7|80-0*79|80{2}-0*79{2}|80{3}-0*79{3}|80{4}-0*79{4}|80{5}-0*79{5}|80{6}-0*79{6}|9-0*8|90-0*89|90{2}-0*89{2}|90{3}-0*89{3}|90{4}-0*89{4}|90{5}-0*89{5}|90{6}-0*89{6})):?[ \\t]+[^\ue100]*|(?:[0-9]{1,7}:?|\\*)[ \\t]+[^\\[\ue100]*\\[[ \\t,]*(?:(?:[A-Za-z0-9_]+[ \\t]*=[ \\t]*(?:\"[^\"\ue100]*\"|[^\\s,\"\ue100][^\\s,\ue100]*)|[A-Za-z0-9_]+(?![A-Za-z0-9_]|\\s*=))[ \\t,]+)*len[ \\t]*=[ \\t]*(?:\"[+-]?0+\"|[+-]?0+)(?:[ \\t,]+(?:(?!len[ \\t]*=)[A-Za-z0-9_]+[ \\t]*=[ \\t]*(?:\"[^\"\ue100]*\"|[^\\s,\"\ue100][^\\s,\ue100]*)|[A-Za-z0-9_]+(?![A-Za-z0-9_]|\\s*=)))*[ \\t,]*\\][ \\t]*)"}
  PK_NONZERO_FIELD: {regex: "(?!(?:[ \\t]*(?:(?=[0-9]{1,7}-[0-9]{1,7}(?![0-9]))0*(?:(?P<pknp>[1-9][0-9]*)(?:1-0*(?P=pknp)0|10-0*(?P=pknp)09|10{2}-0*(?P=pknp)09{2}|10{3}-0*(?P=pknp)09{3}|10{4}-0*(?P=pknp)09{4}|10{5}-0*(?P=pknp)09{5}|10{6}-0*(?P=pknp)09{6}|2-0*(?P=pknp)1|20-0*(?P=pknp)19|20{2}-0*(?P=pknp)19{2}|20{3}-0*(?P=pknp)19{3}|20{4}-0*(?P=pknp)19{4}|20{5}-0*(?P=pknp)19{5}|20{6}-0*(?P=pknp)19{6}|3-0*(?P=pknp)2|30-0*(?P=pknp)29|30{2}-0*(?P=pknp)29{2}|30{3}-0*(?P=pknp)29{3}|30{4}-0*(?P=pknp)29{4}|30{5}-0*(?P=pknp)29{5}|30{6}-0*(?P=pknp)29{6}|4-0*(?P=pknp)3|40-0*(?P=pknp)39|40{2}-0*(?P=pknp)39{2}|40{3}-0*(?P=pknp)39{3}|40{4}-0*(?P=pknp)39{4}|40{5}-0*(?P=pknp)39{5}|40{6}-0*(?P=pknp)39{6}|5-0*(?P=pknp)4|50-0*(?P=pknp)49|50{2}-0*(?P=pknp)49{2}|50{3}-0*(?P=pknp)49{3}|50{4}-0*(?P=pknp)49{4}|50{5}-0*(?P=pknp)49{5}|50{6}-0*(?P=pknp)49{6}|6-0*(?P=pknp)5|60-0*(?P=pknp)59|60{2}-0*(?P=pknp)59{2}|60{3}-0*(?P=pknp)59{3}|60{4}-0*(?P=pknp)59{4}|60{5}-0*(?P=pknp)59{5}|60{6}-0*(?P=pknp)59{6}|7-0*(?P=pknp)6|70-0*(?P=pknp)69|70{2}-0*(?P=pknp)69{2}|70{3}-0*(?P=pknp)69{3}|70{4}-0*(?P=pknp)69{4}|70{5}-0*(?P=pknp)69{5}|70{6}-0*(?P=pknp)69{6}|8-0*(?P=pknp)7|80-0*(?P=pknp)79|80{2}-0*(?P=pknp)79{2}|80{3}-0*(?P=pknp)79{3}|80{4}-0*(?P=pknp)79{4}|80{5}-0*(?P=pknp)79{5}|80{6}-0*(?P=pknp)79{6}|9-0*(?P=pknp)8|90-0*(?P=pknp)89|90{2}-0*(?P=pknp)89{2}|90{3}-0*(?P=pknp)89{3}|90{4}-0*(?P=pknp)89{4}|90{5}-0*(?P=pknp)89{5}|90{6}-0*(?P=pknp)89{6})|(?:1-0*|10-0*9|10{2}-0*9{2}|10{3}-0*9{3}|10{4}-0*9{4}|10{5}-0*9{5}|10{6}-0*9{6}|2-0*1|20-0*19|20{2}-0*19{2}|20{3}-0*19{3}|20{4}-0*19{4}|20{5}-0*19{5}|20{6}-0*19{6}|3-0*2|30-0*29|30{2}-0*29{2}|30{3}-0*29{3}|30{4}-0*29{4}|30{5}-0*29{5}|30{6}-0*29{6}|4-0*3|40-0*39|40{2}-0*39{2}|40{3}-0*39{3}|40{4}-0*39{4}|40{5}-0*39{5}|40{6}-0*39{6}|5-0*4|50-0*49|50{2}-0*49{2}|50{3}-0*49{3}|50{4}-0*49{4}|50{5}-0*49{5}|50{6}-0*49{6}|6-0*5|60-0*59|60{2}-0*59{2}|60{3}-0*59{3}|60{4}-0*59{4}|60{5}-0*59{5}|60{6}-0*59{6}|7-0*6|70-0*69|70{2}-0*69{2}|70{3}-0*69{3}|70{4}-0*69{4}|70{5}-0*69{5