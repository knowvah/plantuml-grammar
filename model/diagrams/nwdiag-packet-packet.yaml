# packetdiag (T27). Upstream pin 97a5992; paths are relative to
# src/main/java/net/sourceforge/plantuml/packetdiag/ unless stated.
#
# Upstream. PacketDiagramFactory.initCommandsList (PacketDiagramFactory.java:75-85)
# registers the common block (CommonCommands.addCommonCommands1) and eight single-line
# commands; the generated model carries them in that order. `packetdiag {` and `}` are
# no-ops (command/CommandPacketDiagStart.java:70-72, command/CommandPacketDiagEnd.java:
# 71-73), so a packet body has no nesting.
#
# Line-local execution error. `scale_interval = N` parses `\d+` with Integer.parseInt and
# fails on overflow (command/CommandScaleInterval.java:73-79): the rule is narrowed to
# JAVA_INT (common) and followed by a reject of the generated shape. colwidth and
# node_height take `\d{1,3}` and the field bounds `\d{1,7}`, which always parse.
#
# Final check. checkFinalError builds the layout (PacketDiagram.java:225-229, :374-382).
# adjustColWidth shrinks colWidth to the summed width of the first row (:387-392);
# getFullIndicatorInterval is then colWidth itself when it is below 4 (:260-262), and
# adjustIndicators computes `i % fullLengthInterval` over `limit(colWidth + 1)` (:394-405).
# A first-row sum of 0 divides by zero; a sum of -2 or less makes `limit` negative
# (IllegalArgumentException); -1 passes. Both throws escape createSystem and become an
# execution error (PSystemBuilder.java:275-281). A field's width is `len` (default 1) for
# `N:` and `*` fields and B - A + 1 for `A-B` (command/CommandNumRange.java:113-138); the
# `len` value is the last `len=` that NwDiagram.toSet finds in the bracket (nwdiag/
# NwDiagram.java:288-303), and an unparsable value means 1 (CommandNumRange.java:90-102).
# A row fills up when the running sum reaches colWidth or a field overflows it
# (adjustLayout :411-458), which needs a positive width, so with non-negative widths the
# check fails exactly when every field of the block has width 0.
#
# Model. Upstream sees the whole field list; a line grammar sees one line. `main` is the
# state before the first field. Its head entry PacketFirstField takes the first field
# (any width) and pushes `packet_body` with `require_pop`; nothing pops it, so at the end
# of the block the interpreter backtracks to that line (docs/grammar-guide.md,
# "Unterminated bodies and rejected lines") after the whole body was validated once. On
# the retry, PacketZeroWidthRow (a `join`) takes a zero-width first field only when a
# field of non-zero width follows later in the block, and PacketZeroWidthOnly rejects a
# zero-width first field otherwise. Every other first field reaches the generated
# CommandNumRange, which (like every field after it) sets `packet_body`, where the head
# entries no longer apply. Emitters see PacketFirstField and the generated rules; they
# drop the reject and skip the join (every path through its parts needs U+E100).
#
# PK_ZERO_FIELD and PK_NONZERO_FIELD are built from a formula: an `A-B` range with
# B = A - 1, or
# an `N:`/`*` field whose bracket is a clean `toSet` list (words, `name=value` items,
# blank or comma separators) ending its `len` items with a zero value. The range form is
# enumerated (shared prefix `p` via the named back reference, then every leading digit d in
# 1-9 and trailing-zero count k in 0-6: `p d 0{k} - 0* p (d-1) 9{k}`, d=1 borrowing from `p`)
# because JavaScript has no regex conditionals (plans/ts-engine/decisions.md#d3). They are sound:
# tests/families/test_nwdiag_packet.py checks them against an arithmetic reference.
# Undetected zero widths (other bracket syntax) and negative widths are gaps
# (tests/fixtures/nwdiag-packet/gap): they can only cause false accepts.
schema_version: 1
id: nwdiag-packet-packet
layer: diagram
diagram: PACKET
factory: PacketDiagramFactory
include: [gen-packet-diagram, common]

variables:
  PK_SPACE: {regex: "[\\s\_]*", ci: true}
  PK_FIELD_RANGE:
    alt:
      - {regex: '(\d{1,7})(?::)?', ci: true, name: RANGE_UNIT, scope: constant.numeric.integer}
      - {regex: '(\d{1,7})(?:-(\d{1,7}))(?::)?', ci: true, name: RANGE, scope: constant.numeric.integer}
      - {literal: "*", ci: true, scope: keyword.operator.wildcard}
  # CommandNumRange.java:77-88, as generated.
  PK_FIELD:
    seq:
      - {ref: PK_SPACE}
      - {ref: PK_FIELD_RANGE}
      - {regex: '\s+(.*?)', ci: true, name: DESC, scope: string.unquoted.packet-field}
      - {regex: '(?:\s*\[(.*?)\])?', ci: true, name: ATTRIBUTE, scope: meta.attribute}
      - {ref: PK_SPACE}
