overrides:
  # CommandNumRange.java:143 (each field is added to the list the final check lays out).
  CommandNumRange: {set: packet_body}
  # command/CommandScaleInterval.java:73-79: Integer.parseInt over `\d+`.
  CommandScaleInterval:
    parts:
      seq:
        - {literal: scale_interval, ci: true, scope: keyword.other.packet}
        - {ref: PK_SPACE}
        - {literal: "=", ci: true}
        - {ref: PK_SPACE}
        - {ref: JAVA_INT}
        - {regex: ";?", ci: true}
        - {ref: PK_SPACE}

insert_after:
  CommandScaleInterval:
    - command: CommandScaleIntervalError
      provenance:
        class: net.sourceforge.plantuml.packetdiag.command.CommandScaleInterval
        file: src/main/java/net/sourceforge/plantuml/packetdiag/command/CommandScaleInterval.java
        line: 77
        engine: IRegex
        also:
          - src/main/java/net/sourceforge/plantuml/packetdiag/command/CommandScaleInterval.java:62-70
      kind: single
      reject: true
      parts:
        seq:
          - {literal: scale_interval, ci: true}
          - {ref: PK_SPACE}
          - {literal: "=", ci: true}
          - {ref: PK_SPACE}
          - {regex: "[0-9]+;?", ci: true}
          - {ref: PK_SPACE}

contexts:
